<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dan - Finance posts</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg"/><link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="robots" content="noindex,nofollow"/>
<style>
:root{
  --bg:#0b1120;--surface:#111827;--surface2:#1a2336;--border:rgba(255,255,255,.08);
  --text:#e8edf5;--muted:#6b7a94;--accent:#3b82f6;--accent-dim:rgba(59,130,246,.15);
  --success:#22c55e;--success-dim:rgba(34,197,94,.14);
  --warn:#f59e0b;--warn-dim:rgba(245,158,11,.12);
  --red:#ef4444;--red-dim:rgba(239,68,68,.12);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  padding-bottom:48px}
.top{position:sticky;top:0;z-index:5;background:rgba(11,17,32,.94);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);padding:14px 18px;display:flex;align-items:center;
  justify-content:space-between;gap:12px}
.brand-name{font-size:15px;font-weight:700;display:block}
.brand-sub{font-size:11px;color:var(--muted)}
.back{font-size:12px;color:var(--accent);text-decoration:none;border:1px solid rgba(59,130,246,.3);
  background:var(--accent-dim);padding:7px 12px;border-radius:9px;white-space:nowrap}
.wrap{max-width:760px;margin:0 auto;padding:20px 18px 0}
.section-title{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--muted);margin:26px 0 10px}
.section-title:first-child{margin-top:0}
.note{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:13px 15px;font-size:12.5px;line-height:1.5;color:var(--muted);margin-bottom:18px}
.note b{color:var(--text)}
.chip.expired{background:var(--red-dim);border-color:rgba(239,68,68,.35);color:#fca5a5}
.chip.expires{background:var(--warn-dim);border-color:rgba(245,158,11,.3);color:#f9d89a}
.card.stale img{opacity:.55}
.terms{font-size:12px;color:var(--muted);margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;margin-bottom:14px}
.card img{width:100%;display:block;background:#0a0c0f}
.card .body{padding:14px 16px 16px}
.name{font-size:15px;font-weight:700;margin-bottom:3px}
.meta{font-size:12px;color:var(--muted);margin-bottom:11px}
.figs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
.chip{font-size:11.5px;background:var(--surface2);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px;color:var(--text)}
.chip b{color:var(--accent)}
.cap{background:#0a0f1c;border:1px solid var(--border);border-radius:10px;padding:11px 13px;
  font-size:12px;line-height:1.55;color:#c3ccdb;white-space:pre-wrap;max-height:150px;
  overflow:auto;margin-bottom:11px}
.btn-row{display:flex;gap:7px;flex-wrap:wrap}
.btn-row a,.btn-row button{flex:1 1 auto;justify-content:center;text-align:center;
  font-family:inherit;font-size:12px;font-weight:600;padding:9px 12px;border-radius:9px;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn-open{background:var(--accent-dim);border:1px solid rgba(59,130,246,.3);color:var(--accent)}
.btn-copy{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-copy.copied{background:var(--success-dim);border-color:rgba(34,197,94,.3);color:var(--success)}
.empty{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:26px 18px;text-align:center;color:var(--muted);font-size:13px}
</style>
</head>
<body>

<div class="top">
  <div>
    <span class="brand-name">Finance posts</span>
    <span class="brand-sub">Story cards &middot; refreshed each morning</span>
  </div>
  <a class="back" href="links.html">&larr; Links</a>
</div>

<div class="wrap">
  <div class="note" id="note">
    <b>Quotes expire.</b> BMW Financial Services rates run to a campaign end date - a card
    posted after it has passed shows a rate that is no longer on offer. Anything out of
    date is marked below.
  </div>
  <div class="terms" id="terms"></div>
  <div id="out"><div class="empty">Loading&hellip;</div></div>
</div>

<script>
function money(n){ return '£' + Number(n).toLocaleString('en-GB'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function copyCap(btn, id){
  var t = document.getElementById(id).textContent;
  var done = function(){ btn.classList.add('copied'); btn.textContent = 'Copied';
    setTimeout(function(){ btn.classList.remove('copied'); btn.textContent = 'Copy caption'; }, 1600); };
  if (navigator.clipboard) { navigator.clipboard.writeText(t).then(done, function(){ fallback(t, done); }); }
  else fallback(t, done);
}
function fallback(t, done){
  var a = document.createElement('textarea');
  a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); done(); } catch(e){}
  document.body.removeChild(a);
}

function niceDate(iso){
  var d = new Date(iso + 'T12:00:00');
  if (isNaN(d)) return iso;
  var today = new Date(); today.setHours(12,0,0,0);
  var diff = Math.round((today - d) / 86400000);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return d.toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
}

fetch('finance-posts/index.json', {cache:'no-cache'})
  .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function(d){
    var posts = d.posts || [];
    var t = d.terms || {};
    document.getElementById('terms').textContent =
      'Quoted on ' + money(t.deposit) + ' deposit (' + t.deposit_pct + '% on cars from '
      + money(t.tier_at) + '), ' + t.term + ' months, '
      + Number(t.mileage).toLocaleString('en-GB') + ' miles a year.';

    if (!posts.length){
      document.getElementById('out').innerHTML =
        '<div class="empty">No cards yet. They are built each morning after the stock refresh.</div>';
      return;
    }

    var days = [], seen = {};
    posts.forEach(function(p){
      if (!seen[p.date]) { seen[p.date] = []; days.push(p.date); }
      seen[p.date].push(p);
    });

    document.getElementById('out').innerHTML = days.map(function(day){
      return '<div class="section-title">' + esc(niceDate(day)) + '</div>'
        + seen[day].map(function(p, i){
          var id = 'cap-' + day + '-' + i;
      var expiry = p.valid_to ? new Date(p.valid_to) : null;
      var stale = expiry && !isNaN(expiry) && expiry < new Date();
      var soon = expiry && !isNaN(expiry) && !stale
        && (expiry - new Date()) < 5 * 86400000;
      var flag = stale
        ? '<span class="chip expired">Quote expired ' + expiry.toLocaleDateString('en-GB',
            {day:'numeric', month:'short'}) + '</span>'
        : soon
          ? '<span class="chip expires">Rate ends ' + expiry.toLocaleDateString('en-GB',
              {day:'numeric', month:'short'}) + '</span>'
          : '';
        return '<div class="card' + (stale ? ' stale' : '') + '">'
          + '<a href="finance-posts/' + esc(p.image) + '" target="_blank" rel="noopener">'
          + '<img src="finance-posts/' + esc(p.image) + '" alt="' + esc(p.model) + '" loading="lazy"/></a>'
          + '<div class="body">'
          + '<div class="name">' + esc(p.model) + '</div>'
          + '<div class="meta">' + esc(p.year) + ' &middot; ' + esc(p.reg) + ' &middot; '
          + esc(p.colour) + ' &middot; ' + esc(p.mileage) + ' &middot; ' + esc(p.price) + '</div>'
          + '<div class="figs">'
          + '<span class="chip"><b>' + money(Math.round(p.monthly)) + '</b> a month</span>'
          + '<span class="chip">' + p.apr + '% APR</span>'
          + '<span class="chip">' + money(Math.round(p.deposit)) + ' deposit</span>'
          + '<span class="chip">' + p.term + ' months</span>'
          + flag
          + '</div>'
          + '<div class="cap" id="' + id + '">' + esc(p.caption) + '</div>'
          + '<div class="btn-row">'
          + '<a class="btn-open" href="finance-posts/' + esc(p.image) + '" download>Save image</a>'
          + '<button class="btn-copy" onclick="copyCap(this,\'' + id + '\')">Copy caption</button>'
          + '<a class="btn-copy" href="' + esc(p.listing) + '" target="_blank" rel="noopener">Listing</a>'
          + '</div></div></div>';
      }).join('');
    }).join('');
  })
  .catch(function(){
    document.getElementById('out').innerHTML =
      '<div class="empty">Could not load the cards. If this is the first run, they appear after the next morning refresh.</div>';
  });
</script>
</body>
</html>
