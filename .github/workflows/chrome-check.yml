name: chrome-check

# Fails if any page's stamped header/drawer/footer is out of sync with
# partials/ — i.e. someone edited a partial (or a stamped block by hand)
# and forgot to run "node build.js" and commit the result.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js --check
