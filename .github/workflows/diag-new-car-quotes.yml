name: diag-new-car-quotes
# Temporary, removed once the quotes run works again.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-new-car-quotes.yml', 'automation/diag-tmp/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-save --no-audit --no-fund puppeteer-core && google-chrome --version && curl -s https://api.ipify.org; echo
      - run: python3 automation/new-stock-urls.py > /tmp/u.json
      - run: node automation/diag-tmp/diag.mjs /tmp/u.json
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: diag, path: /tmp/diag-*.png }
