<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"/>
<title>Forecourt Empire — beta</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
<meta name="theme-color" content="#0a0e1c"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Forecourt"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">

  <!-- boot screen -->
  <div id="screen-boot" class="screen hidden">
    <div style="max-width:460px;margin:8vh auto 0;text-align:center">
      <div class="logo">Forecourt<br>Empire<small>DEALERSHIP MANAGEMENT · BETA</small></div>
      <p class="prose" style="margin-top:30px">£1,000,000. One forecourt. No excuses.</p>
      <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
        <button id="bootContinue" class="big hidden" onclick="UI.continueGame()">Continue career</button>
        <button class="big sec" onclick="UI.newGameFlow()">New career</button>
      </div>
      <p class="muted small" style="margin-top:26px">Internal beta — for Dan &amp; colleagues. Saves locally on this device.</p>
    </div>
  </div>

  <!-- setup wizard -->
  <div id="screen-setup" class="screen hidden"></div>

  <!-- main game -->
  <div id="main" class="hidden">
    <div id="hud">
      <div class="hud-l">
        <div id="hudWeek" onclick="UI.calendar()" role="button" tabindex="0" title="Open the calendar"></div>
        <div class="hud-sub"><span id="hudStars" class="stars"></span><span id="hudStock" class="hud-pill"></span></div>
      </div>
      <div class="hud-r">
        <div id="cashLabel">Cash</div>
        <div id="cash">£0</div>
        <div id="hudNet"></div>
      </div>
    </div>
    <div id="banner"></div>
    <div id="coach" class="hidden"></div>
    <div id="content"></div>
    <div id="tabs">
      <button id="tab-site" class="on" onclick="UI.tab('site')"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 19h18M5 19V9l7-5 7 5v10M9.5 19v-4.5h5V19"/><circle cx="12" cy="10.5" r="1.6"/></svg></span>Site</button>
      <button id="tab-computer" onclick="UI.computer()" style="position:relative"><span class="ico"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M9.5 20.5h5M12 17v3.5M7 20.5h10"/></svg></span>Computer<span class="badge" id="emailBadge" style="display:none">0</span></button>
      <button id="tab-stock" onclick="UI.tab('stock')"><span class="ico"><svg viewBox="0 0 24 24"><path d="M4.5 16.5v2a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1v-2M22 16.5v2a1 1 0 0 1-1 1h-.5a1 1 0 0 1-1-1v-2"/><path d="M2.5 16.5h19v-4l-1.6-.6-2-4.4a2 2 0 0 0-1.8-1.2H7.9a2 2 0 0 0-1.8 1.2l-2 4.4-1.6.6z"/><circle cx="7" cy="14" r="1.1"/><circle cx="17" cy="14" r="1.1"/></svg></span>Stock</button>
      <button id="tab-staff" onclick="UI.tab('staff')"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3.6"/><path d="M4.5 20.5a7.5 7.5 0 0 1 15 0"/></svg></span>Staff</button>
      <button id="tab-reports" onclick="UI.tab('reports')"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3 20.5h18"/><rect x="4.5" y="12" width="3.6" height="7" rx="1"/><rect x="10.2" y="7.5" width="3.6" height="11.5" rx="1"/><rect x="15.9" y="4" width="3.6" height="15" rx="1"/></svg></span>Reports</button>
    </div>
  </div>

  <!-- modal -->
  <div id="overlay" class="hidden"><div class="sheet"></div></div>

</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="scene.js"></script>
<script src="juice.js"></script>
<script src="minigames.js"></script>
<script src="cloud.js"></script>
<script src="ui.js"></script>
<script>
/* PWA registration.

   Updates are automatic: the worker is network-first and calls skipWaiting, so
   a new build activates as soon as it is fetched. When it takes control we
   reload once (guarded against loops) — the game saves after every action, so a
   reload never costs the player anything. We also re-check for a new worker
   whenever the tab comes back to the foreground, which for this game is the
   normal way people return to it. */
(function () {
  if (!('serviceWorker' in navigator)) return;
  var reloading = false;

  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (reloading) return;
    reloading = true;
    location.reload();
  });

  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      // check on return to the foreground, and hourly while open
      function check() { if (navigator.onLine) reg.update().catch(function () {}); }
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') check();
      });
      setInterval(check, 60 * 60 * 1000);
      // a worker already waiting (installed before this load) should take over now
      if (reg.waiting) reg.waiting.postMessage('skipWaiting');
      reg.addEventListener('updatefound', function () {
        var nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          if (nw.state === 'installed' && reg.waiting) reg.waiting.postMessage('skipWaiting');
        });
      });
    }).catch(function () { /* offline or unsupported — the game still runs */ });
  });

  /* Saves live in localStorage, which browsers evict: Safari clears
     script-writable storage after ~7 days without a visit, and Chrome evicts
     under pressure. Asking for persistent storage (granted readily to an
     installed app) is what stops a career quietly disappearing. */
  if (navigator.storage && navigator.storage.persist) {
    navigator.storage.persisted().then(function (already) {
      if (!already) navigator.storage.persist();
    }).catch(function () {});
  }

  // remember the install offer so the desk can present it
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.__installPrompt = e;
  });
})();
</script>
</body>
</html>
