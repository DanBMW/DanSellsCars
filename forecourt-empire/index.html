<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow"/>
<title>Forecourt Empire — beta</title>
<link rel="icon" type="image/svg+xml" href="../favicon.svg"/>
<link rel="apple-touch-icon" href="../apple-touch-icon.png"/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
<div id="app">

  <!-- boot screen -->
  <div id="screen-boot" class="screen hidden">
    <div style="max-width:460px;margin:8vh auto 0;text-align:center">
      <div class="logo">Forecourt<br>Empire<small>DEALERSHIP MANAGEMENT · BETA</small></div>
      <p class="prose" style="margin-top:30px">£1,000,000. One forecourt. No excuses.</p>
      <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
        <button id="bootContinue" class="big hidden" onclick="UI.continueGame()">Continue career</button>
        <button class="big sec" onclick="UI.newGameFlow()">New career</button>
      </div>
      <p class="muted small" style="margin-top:26px">Internal beta — for Dan &amp; colleagues. Saves locally on this device.</p>
    </div>
  </div>

  <!-- setup wizard -->
  <div id="screen-setup" class="screen hidden"></div>

  <!-- main game -->
  <div id="main" class="hidden">
    <div id="hud">
      <div class="left">
        <div id="hudWeek"></div>
        <div id="hudStars" class="stars"></div>
      </div>
      <div>
        <div id="cashLabel">Cash position</div>
        <div id="cash">£0</div>
      </div>
    </div>
    <button class="gear ghost" onclick="UI.gearMenu()" aria-label="Menu">☰</button>
    <div id="banner"></div>
    <div id="content"></div>
    <div id="tabs">
      <button id="tab-site" class="on" onclick="UI.tab('site')"><span class="ico">🅿️</span>Site</button>
      <button id="tab-email" onclick="UI.tab('email')" style="position:relative"><span class="ico">✉️</span>Email<span class="badge" id="emailBadge" style="display:none">0</span></button>
      <button id="tab-stock" onclick="UI.tab('stock')"><span class="ico">🚗</span>Stock</button>
      <button id="tab-staff" onclick="UI.tab('staff')"><span class="ico">👔</span>Staff</button>
      <button id="tab-reports" onclick="UI.tab('reports')"><span class="ico">📊</span>Reports</button>
    </div>
  </div>

  <!-- modal -->
  <div id="overlay" class="hidden"><div class="sheet"></div></div>

</div>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="ui.js"></script>
</body>
</html>
