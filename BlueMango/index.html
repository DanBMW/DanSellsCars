.on .markwrap{animation:spin .8s ease both}
.on .ringdraw{stroke-dasharray:110;stroke-dashoffset:110;animation:draw 1.1s .3s cubic-bezier(.6,0,.2,1) forwards}

.on .pitch{animation:rise .8s 1.1s both}

@keyframes leaf{to{transform:none}}
