<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BlueMango | Web Design Studio</title>
<meta name="description" content="BlueMango is a web design studio helping small businesses stand out from a crowd with modern, minimal websites. Celebrate your individuality.">
<link rel="canonical" href="https://dan-sells.co.uk/BlueMango/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BlueMango">
<meta property="og:title" content="BlueMango | Web Design Studio">
<meta property="og:description" content="Websites that help small businesses stand out from a crowd. Celebrate your individuality.">
<meta property="og:url" content="https://dan-sells.co.uk/BlueMango/">
<meta property="og:image" content="https://dan-sells.co.uk/BlueMango/og.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0B1B3A">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--navy:#0B1B3A;--b1:#0E3597;--b2:#0060A8;--b3:#0078C0;--b4:#0090D8;--cy:#00D8F0;--cy2:#7FE9FF;--mango:#F8A020;--mute:#9FB4D0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--navy)}
body{color:#fff;font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;-webkit-tap-highlight-color:transparent}
.bg{position:fixed;inset:0;background:linear-gradient(115deg,#0E3597,#0078C0,#00D8F0,#0060A8,#F8A020,#0090D8,#7FE9FF,#0E3597);background-size:400% 400%;animation:bg 22s ease-in-out infinite}
@keyframes bg{0%{background-position:0% 40%}50%{background-position:100% 60%}100%{background-position:0% 40%}}
#tess{position:fixed;inset:0;width:100%;height:100%;cursor:pointer}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 35%,rgba(11,27,58,.55))}
#word{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;font-weight:800;font-size:clamp(2.3rem,10.5vw,7rem);line-height:1;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:.05em .05em 0 var(--b1)}
#word span{display:inline-block;animation:pop .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{0%{opacity:0;transform:scale(.4,1.4)}60%{opacity:1}100%{opacity:1;transform:none}}
#word span.out{animation:out .35s ease-in both}
@keyframes out{to{opacity:0;transform:scale(1.25,.3)}}
#lock{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4rem;padding:1.5rem;pointer-events:none;text-align:center}
#lock>*{opacity:0}
.mark{width:clamp(110px,30vw,170px);height:auto;filter:drop-shadow(0 10px 30px rgba(11,27,58,.55));overflow:visible}
h1{font-weight:600;letter-spacing:-.015em;font-size:clamp(3rem,13vw,7.5rem);line-height:.95;color:#fff;-webkit-text-stroke:1.5px var(--navy);paint-order:stroke fill;text-shadow:.045em .045em 0 var(--b1)}
h1 .m{color:var(--cy)}
.tag{font-size:clamp(.72rem,2.6vw,1rem);font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--mute);margin-right:-.3em;text-shadow:0 0 2px #0B1B3A,0 1px 8px rgba(11,27,58,.95),0 0 18px rgba(11,27,58,.8)}
.pitch strong{font-weight:700;font-size:1.15em;color:#7FE9FF}.pitch{margin-top:.6rem;font-size:clamp(1rem,3.8vw,1.2rem);color:#fff;max-width:26rem;line-height:1.45;text-shadow:0 2px 10px rgba(11,27,58,.85)}
.pill{pointer-events:auto;margin-top:1.2rem;font:inherit;font-weight:700;font-size:1.1rem;color:var(--navy);background:#fff;border:3px solid var(--navy);border-radius:999px;padding:.7em 1.6em;box-shadow:5px 5px 0 var(--mango);cursor:pointer;transition:transform .2s,box-shadow .2s}
.pill:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--mango)}
.pill:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--mango)}
.pill:focus-visible,.x:focus-visible{outline:3px solid var(--cy);outline-offset:4px}
.on .mark{animation:fade .6s ease both}
.on .mark .ring{stroke-dasharray:110;stroke-dashoffset:110;animation:draw 1.1s .3s cubic-bezier(.6,0,.2,1) forwards}
.on .mark .ringb{opacity:0;animation:fadeIn .6s 1s forwards}
.on .mark .dot{transform-origin:81.3px 28.3px;transform:scale(0);animation:dot .6s 1.25s cubic-bezier(.3,1.8,.5,1) forwards}
.on .mark .leaf{transform-origin:55px 9px;transform:rotate(-40deg) scale(0);animation:leaf .7s .5s cubic-bezier(.3,1.5,.5,1) forwards}
.on h1{animation:rise .9s .5s cubic-bezier(.2,.9,.2,1) both}
.on .tag{animation:rise .8s .85s cubic-bezier(.2,.9,.2,1) both}
.on .pitch{animation:rise .8s 1.1s cubic-bezier(.2,.9,.2,1) both}
.on .pill{animation:pill 1s 1.7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes fade{from{opacity:0;transform:scale(.6) rotate(-15deg)}to{opacity:1;transform:none}}
@keyframes fadeIn{to{opacity:.45}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes dot{to{transform:scale(1)}}
@keyframes leaf{to{transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pill{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
/* form */
dialog{margin:auto;border:0;padding:0;background:transparent;color:#fff;width:min(92vw,30rem);max-height:92svh}
dialog::backdrop{background:rgba(11,27,58,.6);backdrop-filter:blur(6px)}
dialog[open]{animation:rise .45s cubic-bezier(.2,.9,.2,1)}
form{position:relative;display:grid;gap:.7rem;padding:1.4rem;border-radius:1.4rem;background:rgba(11,27,58,.88);border:3px solid #fff;box-shadow:6px 6px 0 var(--mango)}
form h2{font-weight:600;font-size:1.5rem;letter-spacing:-.015em}
label{font-size:.82rem;color:var(--mute);display:grid;gap:.3rem}
input,textarea{font:inherit;font-size:16px;color:#fff;background:rgba(255,255,255,.06);border:1px solid rgba(159,180,208,.35);border-radius:.7rem;padding:.7rem .85rem}
textarea{min-height:6rem;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(0,216,240,.25)}
.send{font:inherit;font-weight:700;color:var(--navy);background:var(--mango);border:3px solid #fff;border-radius:999px;padding:.8rem;cursor:pointer;margin-top:.3rem}
.x{position:absolute;top:.6rem;right:.8rem;background:none;border:0;color:var(--mute);font-size:1.6rem;cursor:pointer;line-height:1}
.hp{position:absolute;left:-9999px}
.status{min-height:1.2em;font-size:.9rem;text-align:center;color:var(--mute)}
.two{display:grid;gap:.7rem}
@media(min-width:560px){.two{grid-template-columns:1fr 1fr}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.bg{animation:none}*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<canvas id="tess" aria-hidden="true"></canvas>
<div class="vig" aria-hidden="true"></div>
<div id="word" aria-hidden="true"></div>
<main id="lock">
<svg class="mark" viewBox="0 0 100 100" role="img" aria-label="BlueMango logo"><defs><linearGradient id="bmFlesh" x1="0.2" y1="0.08" x2="0.82" y2="0.94"><stop offset="0" stop-color="#0E3597"/><stop offset="1" stop-color="#00D8F0"/></linearGradient><clipPath id="bmClip"><path d="M49,18 C71,18 86,35 86,55 C86,74 72,88 55,88 C37,88 21,78 20,62 C19,44 31,18 49,18 Z"/></clipPath></defs><path class="ringb" d="M11.1,63.7 A42,13 -22 0 1 88.9,32.3" fill="none" stroke="#7FE9FF" stroke-width="2.8" stroke-linecap="round" opacity="0.45"/><path d="M49,18 C71,18 86,35 86,55 C86,74 72,88 55,88 C37,88 21,78 20,62 C19,44 31,18 49,18 Z" fill="url(#bmFlesh)"/><g class="leaf"><path d="M49,18 C50,13 52,10 56,7" fill="none" stroke="#7FE9FF" stroke-width="4" stroke-linecap="round"/><path d="M55,9 C46,0 32,-1 24,5 C30,14 46,16 55,9 Z" fill="#0090D8"/></g><path class="ring" d="M11.1,63.7 A42,13 -22 0 0 88.9,32.3" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/><g clip-path="url(#bmClip)"><path d="M11.1,63.7 A42,13 -22 0 0 88.9,32.3" fill="none" stroke="#0B1B3A" stroke-width="5" stroke-linecap="round"/></g><g clip-path="url(#bmClip)"><path class="ring" d="M11.1,63.7 A42,13 -22 0 0 88.9,32.3" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></g><circle class="dot" cx="81.3" cy="28.3" r="4" fill="#F8A020"/></svg>
<h1>Blue<span class="m">Mango</span></h1>
<p class="tag">Web Design Studio</p>
<p class="pitch"><strong>Celebrate your individuality.</strong><br>Websites that help small businesses stand out from a crowd.</p>
<button class="pill" id="open" type="button" aria-haspopup="dialog">Let's talk</button>
</main>
<dialog id="dlg" aria-labelledby="fh">
<form id="f" action="https://formspree.io/f/xqewleog" method="POST">
<button class="x" type="button" id="close" aria-label="Close">×</button>
<h2 id="fh">Let's talk</h2>
<div class="two">
<label>Name<input name="name" autocomplete="name" required></label>
<label>Email<input name="email" type="email" autocomplete="email" required></label>
</div>
<label>Business<input name="business" autocomplete="organization"></label>
<label>Message<textarea name="message" required placeholder="Tell me about your business and what you need."></textarea></label>
<input class="hp" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
<input type="hidden" name="_subject" value="New BlueMango enquiry">
<input type="hidden" name="source" value="BlueMango">
<button class="send" type="submit">Send</button>
<p class="status" id="s" role="status" aria-live="polite"></p>
</form>
</dialog>
<script>
(()=>{
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const c=document.getElementById('tess'),x=c.getContext('2d');
let W,H,D,cells=[],S;
// 6-vertex unit shapes so any pattern can morph into any other
const P=(a)=>a.map(([u,v])=>[u,v]);
const hex=[...Array(6)].map((_,k)=>{const a=Math.PI/180*(30+60*k);return[Math.cos(a)*.95,Math.sin(a)*.95]});
const tri=(()=>{const t=[90,210,330].map(d=>{const a=d*Math.PI/180;return[Math.cos(a)*1.05,-Math.sin(a)*1.05]});return[t[0],[(t[0][0]+t[1][0])/2,(t[0][1]+t[1][1])/2],t[1],[(t[1][0]+t[2][0])/2,(t[1][1]+t[2][1])/2],t[2],[(t[2][0]+t[0][0])/2,(t[2][1]+t[0][1])/2]]})();
const chev=P([[-.95,-.55],[0,.05],[.95,-.55],[.95,.05],[0,.65],[-.95,.05]]);
const dia=P([[0,-1],[.35,-.5],[.7,0],[0,1],[-.35,.5],[-.7,0]]);
const bar=P([[-.15,-1],[.15,-1],[.15,0],[.15,1],[-.15,1],[-.15,0]]);
// patterns: shape, rotation, scale x/y, alternating flip (tessellation feel)
const PATS=[
 {s:hex,r:0,sx:1,sy:1,f:0},
 {s:tri,r:0,sx:1.05,sy:1.05,f:1},
 {s:chev,r:0,sx:1,sy:1,f:0},
 {s:hex,r:Math.PI/6,sx:1.2,sy:.8,f:0},
 {s:dia,r:0,sx:1,sy:1,f:1},
 {s:bar,r:Math.PI/3,sx:1,sy:1.1,f:1},
 {s:chev,r:Math.PI,sx:1,sy:1,f:1},
];
let from=0,to=0,t0=0,dur=1400,alpha=1,alphaTo=1;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);
 S=Math.max(34,Math.min(W,H)/11);cells=[];const dx=S*1.732*.58*1.732,dy=S*.87;const cx=W/2,cy=H/2,maxd=Math.hypot(cx,cy);
 for(let j=-1,row=0;j*dy<H+S;j++,row++)for(let i=-1;i*dx<W+S;i++){const px=i*dx+(row%2?dx/2:0),py=j*dy;cells.push({x:px,y:py,d:Math.hypot(px-cx,py-cy)/maxd,o:(i+row)%2})}}
size();addEventListener('resize',size);
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const back=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function morph(n){from=to;to=n??((to+1+Math.floor(Math.random()*(PATS.length-1)))%PATS.length);t0=performance.now()}
function frame(now){x.clearRect(0,0,W,H);
 const A=PATS[from],B=PATS[to],g=(now-t0)/dur;
 alpha+=(alphaTo-alpha)*.04;
 const grad=x.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.hypot(W,H)/2);
 grad.addColorStop(0,`rgba(26,44,84,${.92*alpha})`);grad.addColorStop(1,`rgba(6,14,32,${alpha})`);x.fillStyle=grad;
 const wob=Math.sin(now/1600)*.04;
 for(const k of cells){let p=Math.min(1,Math.max(0,(g-k.d*.45)/.55));const e=back(ease(p));
  const r=A.r+(B.r-A.r)*e+(k.o&&B.f?Math.PI*e:0)+(k.o&&A.f?Math.PI*(1-e):0)+wob*(k.o?1:-1);
  const sx=(A.sx+(B.sx-A.sx)*e)*S*.66,sy=(A.sy+(B.sy-A.sy)*e)*S*.66;
  const pulse=1-.25*Math.sin(Math.PI*Math.min(1,Math.max(0,p)));
  const cs=Math.cos(r),sn=Math.sin(r);x.beginPath();
  for(let v=0;v<6;v++){const u=(A.s[v][0]+(B.s[v][0]-A.s[v][0])*e)*sx*pulse,w=(A.s[v][1]+(B.s[v][1]-A.s[v][1])*e)*sy*pulse;
   const X=k.x+u*cs-w*sn,Y=k.y+u*sn+w*cs;v?x.lineTo(X,Y):x.moveTo(X,Y)}
  x.closePath();x.fill()}
 if(!RM)requestAnimationFrame(frame)}
const lock=document.getElementById('lock'),word=document.getElementById('word');
function final(){alphaTo=.62;lock.classList.add('on');lock.querySelectorAll(':scope>*').forEach(e=>e.style.opacity=1)}
if(RM){alpha=.62;final();requestAnimationFrame(frame);addEventListener('resize',()=>requestAnimationFrame(frame))}
else{
 requestAnimationFrame(frame);
 const W4=["Stand out","from a crowd.","Celebrate","your individuality."];let i=0;
 const show=()=>{const old=word.firstChild;if(old){old.classList.add('out');setTimeout(()=>old.remove(),350)}
  if(i<W4.length){setTimeout(()=>{const s=document.createElement('span');s.textContent=W4[i++];word.appendChild(s);morph()},old?300:0);setTimeout(show,1500)}
  else{setTimeout(()=>{morph(0);final();setInterval(()=>morph(),4200)},300)}};
 setTimeout(show,500);
 c.addEventListener('click',()=>morph());
}
// form dialog
const dlg=document.getElementById('dlg'),f=document.getElementById('f'),s=document.getElementById('s');
document.getElementById('open').onclick=()=>{dlg.showModal();f.querySelector('input').focus()};
document.getElementById('close').onclick=()=>dlg.close();
dlg.addEventListener('click',e=>{if(e.target===dlg)dlg.close()});
f.addEventListener('submit',async e=>{e.preventDefault();s.textContent='Sending…';try{const r=await fetch(f.action,{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}});
 if(r.ok){f.reset();s.textContent="Thanks! I'll be in touch shortly."}else throw 0}catch{s.textContent='Something went wrong. Please try again.'}});
})();
</script>
</body>
</html>
