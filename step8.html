<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DanSells | Review</title>
<link rel="stylesheet" href="style.css"/>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-XZL1RF6SV6"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-XZL1RF6SV6');</script>
</head>
<body>
<div class="app"><div class="shell">
  <div class="topbar">
    <div class="brand"><span class="brand-name">DanSells</span><span class="brand-sub">Powered by BMW Ruxley</span></div>
    <div class="meta"><span class="dot"></span><span>Step 11 of 11</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-row"><span>Step 11 of 11</span><span>Under 2 minutes</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:100%"></div></div>
  </div>
  <div class="step-wrap">
    <div class="step-kicker">Review</div>
    <h2>This is what Dan receives.</h2>
    <p class="step-desc">Check it looks right, then send it. His inbox and your booking link are next.</p>
    <div class="summary-grid" id="sg"></div>
    <div class="nav">
      <a class="btn-ghost" href="step7.html">&larr; Back</a>
      <button class="btn" id="sb" onclick="sendForm()">Send to Dan &amp; book my call &rarr;</button>
    </div>
    <p class="hint" style="margin-top:14px;">Sending this also opens your booking page with your details pre-filled.</p>
  </div>
</div></div>
<script>
// [label, sessionStorage key, isMoney]
var fields = [
  ["Name",              "fullName"],
  ["Email",             "email"],
  ["Mobile",            "phone"],
  ["Postcode",          "postcode"],
  ["Best time",         "bestTime"],
  ["Lifestyle",         "lifestyle"],
  ["Body styles",       "bodyStyles"],
  ["Change timeline",   "timeline"],
  ["Funding route",     "purchaseType"],
  ["Deposit",           "deposit",         true],
  ["Annual mileage",    "annualMileage"],
  ["Monthly budget",    "monthlyBudget",   true],
  ["Cash budget",       "cashBudget",      true],
  ["Alt finance",       "altMonthly",      true],
  ["Part exchange",     "partExchange"],
  ["PX finance",        "pxFinance"],
  ["PX settlement",     "pxSettlement"],
  ["Current car",       "currentCar"],
  ["PX model",          "pxModel"],
  ["Mileage",           "mileage"],
  ["Online buyer quote","wbacVal"],
  ["Model preference",  "modelPref"],
  ["Extra notes",       "notes"],
  ["Colours",           "specColours"],
  ["Trim",              "specTrim"],
  ["Needs",             "specNeeds"],
  ["Wants",             "specWants"],
  ["Marketing opt-in",  "marketingOptIn"],
  ["Marketing channels","marketingChannels"]
];

// Keys whose values are stored as JSON arrays
var ARRAY_KEYS = ["bodyStyles","specColours","specNeeds","specWants"];

function isArray(key){ return ARRAY_KEYS.indexOf(key) !== -1; }

function readVal(key){
  var raw = sessionStorage.getItem(key);
  if(!raw) return "";
  if(isArray(key)){
    try { var arr = JSON.parse(raw); return Array.isArray(arr) ? arr.join(", ") : raw; }
    catch(e){ return raw; }
  }
  return raw;
}

// Build summary grid
var sg = document.getElementById("sg");
fields.forEach(function(f){
  var label = f[0], key = f[1], isMoney = f[2];
  var val = readVal(key);
  if(!val) return;
  if(isMoney){ var n = Number(val.replace(/,/g,"")); if(!isNaN(n)) val = n.toLocaleString("en-GB"); }
  var d = document.createElement("div");
  d.className = "summary-item";
  d.innerHTML = "<b>" + label + "</b><div>" + val + "</div>";
  sg.appendChild(d);
});

function buildText(){
  return fields.map(function(f){
    var label = f[0], key = f[1], isMoney = f[2];
    var val = readVal(key) || "Not given";
    if(isMoney && readVal(key)){
      var n = Number(readVal(key).replace(/,/g,""));
      if(!isNaN(n)) val = n.toLocaleString("en-GB");
    }
    return label + ": " + val;
  }).join("\n");
}

var WORKER = 'https://vehicleproxy.danielcane1992.workers.dev';

async function pollMarket(runId){
  if(!runId) return null;
  for(var i=0;i<5;i++){
    await new Promise(function(r){setTimeout(r,2000);});
    try{
      var r=await fetch(WORKER+'?target=market-poll&runId='+encodeURIComponent(runId));
      var d=await r.json();
      if(d.status==='SUCCEEDED'){
        var prices=(d.items||[]).map(function(l){return l.pricing&&l.pricing.mainPrice?l.pricing.mainPrice:0;}).filter(function(p){return p>500;}).sort(function(a,b){return a-b;});
        if(prices.length){
          var avg=prices.reduce(function(a,b){return a+b;},0)/prices.length;
          return{low:'£'+Math.round(prices[0]).toLocaleString('en-GB'),avg:'£'+Math.round(avg).toLocaleString('en-GB'),high:'£'+Math.round(prices[prices.length-1]).toLocaleString('en-GB'),trade:'£'+Math.round(avg*0.80).toLocaleString('en-GB')};
        }
        break;
      }
      if(d.status==='FAILED') break;
    }catch(e){break;}
  }
  return null;
}

function generateStory(){
  var fn=sessionStorage.getItem("fullName")||"someone special";
  var first=fn.split(" ")[0];
  var ls=sessionStorage.getItem("lifestyle")||"";
  var bs;try{bs=JSON.parse(sessionStorage.getItem("bodyStyles")||"[]");}catch(e){bs=[];}
  var pt=sessionStorage.getItem("purchaseType")||"";
  var mo=sessionStorage.getItem("monthlyBudget")||"";
  var ca=sessionStorage.getItem("cashBudget")||"";
  var dep=sessionStorage.getItem("deposit")||"";
  var mil=sessionStorage.getItem("annualMileage")||"";
  var tl=sessionStorage.getItem("timeline")||"the near future";
  var cc=sessionStorage.getItem("currentCar")||"";
  var pm=sessionStorage.getItem("pxModel")||"";
  var hpx=["Yes","Maybe"].includes(sessionStorage.getItem("partExchange")||"");
  var nt=sessionStorage.getItem("notes")||"";
  var mpref=sessionStorage.getItem("modelPref")||"";
  var nd;try{nd=JSON.parse(sessionStorage.getItem("specNeeds")||"[]");}catch(e){nd=[];}
  var wt;try{wt=JSON.parse(sessionStorage.getItem("specWants")||"[]");}catch(e){wt=[];}

  var sm={hatchback:"hatchback",saloon:"saloon",touring:"estate",suv:"SUV",coupe:"coupé",convertible:"convertible",gran_coupe:"Gran Coupé"};
  var sn=bs.map(function(s){return sm[s]||s;});
  var fs=sn.length===0?"BMW":sn.length===1?sn[0]:sn.slice(0,-1).join(", ")+" or "+sn[sn.length-1];
  var fmt=function(v){return v?Number(v.replace(/,/g,"")).toLocaleString("en-GB"):"";};
  var mStr=mil?fmt(mil)+" miles a year":"";
  var bStr=pt==="Outright"?(ca?"£"+fmt(ca)+" to spend outright":""):(mo?"£"+fmt(mo)+" a month":"");
  var dStr=dep?"£"+fmt(dep)+" deposit":"";
  var pxStr=hpx?[cc,pm].filter(Boolean).join(" "):"";
  var mNote=mpref?" — specifically, "+mpref:"";

  var bLine=(bStr&&dStr)?"With "+bStr+" in mind and "+dStr+" ready to go":bStr?"With "+bStr+" in mind":dStr?"With "+dStr+" to put down":"Ready to move";
  var sLine="";
  if(nd.length||wt.length){
    var p=[];
    if(nd.length) p.push("must-haves: "+nd.join(", ").toLowerCase());
    if(wt.length) p.push("wishlist: "+wt.join(", ").toLowerCase());
    sLine="On spec, "+p.join("; ")+".";
  }
  var pxLine=pxStr?"Their "+pxStr+" was flagged as a part exchange.":"";
  var ntLine=nt?"In their own words: “"+nt+"”":"";
  var p3=(ntLine?ntLine+"\n\n":"");

  if(ls==="Family life"){
    return fn+" decided that real life — the school run, the weekend away, the everyday — deserved a proper BMW.\n\nAfter "+tl+" of considering the options, a "+fs+mNote+" made it to the top of the list. "+bLine+", "+first+" answered every question Dan had set. "+sLine+" "+pxLine+(mStr?" With "+mStr+" on the road each year, space and comfort were non-negotiable.":"")+"\n\n"+p3+"Dan read through the brief and got straight to work. A family buyer who knows what they need and is ready to move — one of the best kinds of brief there is.";
  }
  if(ls==="Business miles"){
    return "There once was someone called "+fn+" who knew that in their line of work, the car they arrived in said something about them.\n\n"+(mStr?"With "+mStr+" on the road each year, they":"They")+" had been watching a "+fs+mNote+" for "+tl+" — something that did the long runs in total comfort and still looked exceptional on arrival. "+bLine+", "+first+" submitted a brief that was clear, specific, and genuinely easy to work with. "+sLine+" "+pxLine+"\n\n"+p3+"Dan had everything he needed. When someone this professional hands you a brief, you don’t keep them waiting.";
  }
  if(ls==="Driver first"){
    return "Some people need a car. "+fn+" wants one — properly.\n\nA "+fs+mNote+" had been on the wishlist for "+tl+", and "+first+" finally did something about it. "+bLine+", they submitted a brief built around the things that actually matter: feel, precision, and a drive worth looking forward to every single morning. "+sLine+" "+pxLine+(mStr?" "+mStr+", every mile to be enjoyed.":"")+"\n\n"+p3+"Dan’s read the brief. He’s quietly excited. This is what happens when someone who really cares about the drive sits down and just writes it all out.";
  }
  if(ls==="Future-forward"){
    return "There once was someone called "+fn+" who had been paying close attention to where cars were heading — and decided the future looked rather good.\n\nElectric, hybrid, or something clever in between: after "+tl+", "+first+" was ready to stop reading the reviews and start talking to someone who actually knew the answers. A "+fs+mNote+" was on the radar. "+bLine+". "+sLine+" "+pxLine+"\n\n"+p3+"Dan had the full picture. Someone who has thought it through, asked the right questions, and come to exactly the right person to find the answers.";
  }
  if(ls==="Keep it simple"){
    return "There once was someone called "+fn+" who had a refreshingly clear idea of what they wanted: reliability, great value, and a "+fs+mNote+" that did exactly what it was supposed to.\n\nAfter "+tl+", "+first+" gave Dan a brief that was clean, direct, and easy to act on. "+bLine+". "+sLine+" "+pxLine+(mStr?" "+mStr+" a year, every one covered in quiet comfort.":"")+"\n\n"+p3+"Dan appreciated the clarity. No waffle, no vague wish lists — just a great buyer who knows what they want and is ready to get it.";
  }
  return "There once was someone called "+fn+" who decided that "+tl+" was the right moment to find their next BMW.\n\nA "+fs+mNote+" had caught their attention, and after careful consideration, they sat down and filled in Dan’s questionnaire completely. "+bLine+", they handed Dan a brief with everything he needed. "+sLine+" "+pxLine+"\n\n"+p3+"Dan is on it. A considered buyer with a clear eye for the right brand and the right time to buy.";
}

async function sendForm(){
  var btn = document.getElementById("sb");
  btn.textContent = "Sending…";
  btn.disabled = true;

  var name    = sessionStorage.getItem("fullName") || "";
  var email   = sessionStorage.getItem("email")    || "";
  var summary = buildText();

  var calUrl = "https://cal.eu/danbmwruxley/telephone-appointment?" +
    new URLSearchParams({name: name, email: email, notes: summary}).toString();

  sessionStorage.setItem("bookingUrl", calUrl);

  var market = await pollMarket(sessionStorage.getItem('pxMarketRunId'));

  var story = generateStory();
  sessionStorage.setItem('customerStory', story);

  var payload = {
    name:             name,
    email:            email,
    phone:            sessionStorage.getItem("phone")         || "",
    postcode:         sessionStorage.getItem("postcode")      || "",
    besttime:         sessionStorage.getItem("bestTime")      || "",
    lifestyle:        sessionStorage.getItem("lifestyle")     || "",
    bodystyles:       readVal("bodyStyles"),
    changetimeline:   sessionStorage.getItem("timeline")      || "",
    fundingroute:     sessionStorage.getItem("purchaseType")  || "",
    deposit:          readVal("deposit")       ? Number((readVal("deposit")||"0").replace(/,/g,"")).toLocaleString("en-GB") : "",
    monthlybudget:    readVal("monthlyBudget") ? Number((readVal("monthlyBudget")||"0").replace(/,/g,"")).toLocaleString("en-GB") : "",
    annualmileage:    sessionStorage.getItem("annualMileage") || "",
    cashbudget:       readVal("cashBudget")    ? Number((readVal("cashBudget")||"0").replace(/,/g,"")).toLocaleString("en-GB") : "",
    altfinance:       readVal("altMonthly")    ? Number((readVal("altMonthly")||"0").replace(/,/g,"")).toLocaleString("en-GB") : "",
    partexchange:     sessionStorage.getItem("partExchange")  || "",
    currentcar:       sessionStorage.getItem("currentCar")    || "",
    pxmodel:          sessionStorage.getItem("pxModel")       || "",
    pxfinance:        sessionStorage.getItem("pxFinance")     || "",
    pxsettlement:     sessionStorage.getItem("pxSettlement")  || "",
    mileage:          sessionStorage.getItem("mileage")       || "",
    onlinebuyerquote: sessionStorage.getItem("wbacVal")       || "",
    modelpref:        sessionStorage.getItem("modelPref")      || "",
    notes:            sessionStorage.getItem("notes")         || "",
    colours:          readVal("specColours"),
    trim:             sessionStorage.getItem("specTrim")      || "",
    spec_needs:       readVal("specNeeds"),
    spec_wants:       readVal("specWants"),
    spec_bypass:      sessionStorage.getItem("specBypass")    || "",
    leadsummary:      summary,
    customer_story:   story,
    marketing_opt_in:      sessionStorage.getItem("marketingOptIn")    || "No",
    marketing_channels:    sessionStorage.getItem("marketingChannels") || "",
    subject:          "DanSells lead: " + name,
    replyto:          email,
    px_market_low:          market ? market.low   : "",
    px_market_avg:          market ? market.avg   : "",
    px_market_high:         market ? market.high  : "",
    px_market_trade_estimate: market ? market.trade : ""
  };

  fetch("https://formspree.io/f/xqewleog", {
    method: "POST",
    headers: {"Content-Type":"application/json","Accept":"application/json"},
    body: JSON.stringify(payload)
  })
  .catch(function(){})
  .finally(function(){
    window.location.href = "thankyou.html";
  });
}
</script>
</body>
</html>
