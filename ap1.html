<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>DanSells | Vehicle Appraisal</title><link rel="stylesheet" href="style.css"/>  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-XZL1RF6SV6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-XZL1RF6SV6');
  </script>
</head>
<body><div class="app"><div class="shell">
  <div class="topbar">
    <div class="brand"><span class="brand-name">DanSells</span><span class="brand-sub">Vehicle Appraisal</span></div>
    <div class="meta"><span class="dot"></span><span>Step 1 of 6</span></div>
  </div>
  <div class="progress-wrap">
    <div class="progress-row"><span>Step 1 of 6</span><span>Under 2 minutes</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:16%"></div></div>
  </div>
<div class="step-wrap">
  <div class="step-kicker">Your vehicle</div>
  <h2>Tell Dan about your current car.</h2>
  <p class="step-desc">The more accurate you are, the more accurate Dan's part exchange figure will be.</p>
  <div class="input-card">
    <div class="two-col">
      <div class="field-group">
        <label>Registration *</label>
        <div style="display:flex;gap:8px;align-items:flex-end">
          <input id="reg" type="text" placeholder="e.g. AB21 XYZ" style="text-transform:uppercase;flex:1" oninput="this.value=this.value.toUpperCase()"/>
          <button class="btn" id="dvlaBtn" onclick="dvlaLookup()" style="padding:12px 14px;white-space:nowrap;font-size:.88rem">Look Up</button>
        </div>
      </div>
      <div class="field-group"><label>Mileage *</label><input id="ml" type="number" placeholder="e.g. 32000"/></div>
    </div>
    <div id="dvlaBanner" style="display:none;background:rgba(21,89,207,.08);border:1px solid rgba(21,89,207,.22);border-radius:12px;padding:11px 15px;font-size:.88rem;color:#0e3f96;margin-bottom:0">
      Found: <strong id="dvlaDesc"></strong>
    </div>
    <div class="two-col">
      <div class="field-group"><label>Make & Model</label><input id="makemodel" type="text" placeholder="e.g. BMW 3 Series 320i M Sport"/></div>
      <div class="field-group"><label>Year</label><input id="yr" type="text" placeholder="e.g. 2021"/></div>
    </div>
    <div class="two-col">
      <div class="field-group"><label>Colour</label><input id="col" type="text" placeholder="e.g. Alpine White"/></div>
      <div class="field-group"><label>Fuel type</label>
        <select id="fuel">
          <option value="">Select...</option>
          <option value="Petrol">Petrol</option>
          <option value="Diesel">Diesel</option>
          <option value="Hybrid">Hybrid (PHEV)</option>
          <option value="Mild Hybrid">Mild Hybrid (MHEV)</option>
          <option value="Electric">Full Electric (BEV)</option>
        </select>
      </div>
    </div>
    <div class="field-group"><label>Any notable extras / spec</label><input id="spec" type="text" placeholder="e.g. Pro Pack, heated seats, panoramic roof, M Sport Pro"/></div>
  </div>
  <div class="nav">
    <a class="btn-ghost" href="appraisal.html">&larr; Back</a>
    <button class="btn" onclick="go()">Continue &rarr;</button>
  </div>
</div></div></div>
<script>
  const WORKER = 'https://vehicleproxy.danielcane1992.workers.dev';

  function toTC(str){ return (str||'').replace(/\w\S*/g,t=>t.charAt(0).toUpperCase()+t.slice(1).toLowerCase()); }

  [["reg","apReg"],["ml","apMileage"],["makemodel","apMakeModel"],["yr","apYear"],["col","apColour"],["fuel","apFuel"],["spec","apSpec"]].forEach(([id,key])=>{
    const v=sessionStorage.getItem(key); if(v) document.getElementById(id).value=v;
  });

  async function dvlaLookup(){
    const reg=document.getElementById("reg").value.trim().replace(/\s/g,"").toUpperCase();
    if(!reg) return;
    const btn=document.getElementById("dvlaBtn");
    btn.disabled=true; btn.textContent="…";
    document.getElementById("dvlaBanner").style.display="none";
    try{
      const res=await fetch(`${WORKER}?target=dvla-lookup&reg=${encodeURIComponent(reg)}`);
      const d=await res.json();
      if(d.make){
        const make=toTC(d.make), model=toTC(d.model||""), yr=String(d.yearOfManufacture||d.year||""), col=toTC(d.colour||""), fuel=(d.fuelType||"").toLowerCase();
        if(make)  document.getElementById("makemodel").value=[make,model].filter(Boolean).join(" ");
        if(yr)    document.getElementById("yr").value=yr;
        if(col)   document.getElementById("col").value=col;
        const fuelSel=document.getElementById("fuel");
        const fuelMap={petrol:"Petrol",diesel:"Diesel",hybrid:"Hybrid","mild hybrid":"Mild Hybrid",electricity:"Electric",electric:"Electric"};
        if(fuelMap[fuel]) fuelSel.value=fuelMap[fuel];
        const parts=[yr,make,model,col,toTC(d.fuelType||"")].filter(Boolean);
        document.getElementById("dvlaDesc").textContent=parts.join(" · ");
        document.getElementById("dvlaBanner").style.display="block";
      }
    }catch(e){}
    btn.disabled=false; btn.textContent="Look Up";
  }

  (function init(){
    const p=new URLSearchParams(window.location.search), reg=p.get("reg");
    if(reg){ document.getElementById("reg").value=reg.toUpperCase(); dvlaLookup(); }
  })();

  function go(){
    const r=document.getElementById("reg").value.trim(), m=document.getElementById("ml").value.trim();
    if(!r||!m){ alert("Registration and mileage are needed to start."); return; }
    sessionStorage.setItem("apReg",r.toUpperCase());
    sessionStorage.setItem("apMileage",m);
    sessionStorage.setItem("apMakeModel",document.getElementById("makemodel").value.trim());
    sessionStorage.setItem("apYear",document.getElementById("yr").value.trim());
    sessionStorage.setItem("apColour",document.getElementById("col").value.trim());
    sessionStorage.setItem("apFuel",document.getElementById("fuel").value);
    sessionStorage.setItem("apSpec",document.getElementById("spec").value.trim());
    window.location.href="ap2.html";
  }
</script><script src="scroll-hint.js"></script><script src="disclaimer.js"></script>
</body></html>
