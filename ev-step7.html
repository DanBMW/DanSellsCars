<script>
  const TRIP_LABELS = ['Never','Maybe once a year','A few times a year','Monthly','Weekly','Daily'];
  const fields = [
    ['Name',                   'evName'],
    ['Email',                  'evEmail'],
    ['Mobile',                 'evPhone'],
    ['Postcode',               'evPostcode'],
    ['Best time',              'evBestTime'],
    ['Lifestyle',              'evLifestyle', false, true],
    ['EV style',               'evStyle'],
    ['Change timeline',        'evTimeline'],
    ['Funding',                'evFunding'],
    ['Current monthly payment','evCurrentPayment', true],
    ['Monthly budget',         'evMonthlyBudget',  true],
    ['Cash budget',            'evCashBudget',     true],
    ['Annual mileage',         'evMileage'],
    ['200+ mile days',         'evLongTripsLabel'],
    ['Driveway / charging',    'evDriveway'],
    ['Home charger',           'evCharger'],
    ['Part exchange',          'evPX'],
    ['PX reg',                 'evReg'],
    ['Current car',            'evCurrentCar'],
    ['PX model',               'evPXModel'],
    ['PX mileage',             'evPXMileage'],
    ['Online buyer quote',     'evWBAC',           true],
    ['PX service history',     'evPXService'],
    ['PX finance',             'evPXFinance'],
    ['PX settlement',          'evSettlement',     true],
    ['PX condition',           'evPXCond'],
    ['Extra notes',            'evNotes'],
  ];

  const sg = document.getElementById('sg');
  fields.forEach(([label, key, isMoney, isJSON]) => {
    let val = sessionStorage.getItem(key);
    if (!val) return;
    if (isJSON) { try { val = JSON.parse(val).join(', '); } catch(e) {} }
    if (isMoney && val && !isNaN(val)) val = '£' + Number(val).toLocaleString('en-GB');
    const d = document.createElement('div');
    d.className = 'summary-item';
    d.innerHTML = '<b>' + label + '</b><div>' + val + '</div>';
    sg.appendChild(d);
  });

  const WORKER = 'https://vehicleproxy.danielcane1992.workers.dev';

  async function pollMarket(runId){
    if(!runId) return null;
    for(let i=0;i<5;i++){
      await new Promise(r=>setTimeout(r,2000));
      try{
        const r=await fetch(WORKER+'?target=market-poll&runId='+encodeURIComponent(runId));
        const d=await r.json();
        if(d.status==='SUCCEEDED'){
          const prices=(d.items||[]).map(l=>l.pricing&&l.pricing.mainPrice?l.pricing.mainPrice:0).filter(p=>p>500).sort((a,b)=>a-b);
          if(prices.length){
            const avg=prices.reduce((a,b)=>a+b,0)/prices.length;
            return{low:'£'+Math.round(prices[0]).toLocaleString('en-GB'),avg:'£'+Math.round(avg).toLocaleString('en-GB'),high:'£'+Math.round(prices[prices.length-1]).toLocaleString('en-GB'),trade:'£'+Math.round(avg*0.80).toLocaleString('en-GB')};
          }
          break;
        }
        if(d.status==='FAILED') break;
      }catch(e){break;}
    }
    return null;
  }

  function generateEVStory(){
    const fn=sessionStorage.getItem('evName')||'someone special';
    const first=fn.split(' ')[0];
    const tl=sessionStorage.getItem('evTimeline')||'the near future';
    const mil=sessionStorage.getItem('evMileage')||'';
    const fund=sessionStorage.getItem('evFunding')||'';
    const mo=sessionStorage.getItem('evMonthlyBudget')||'';
    const ca=sessionStorage.getItem('evCashBudget')||'';
    const dep=sessionStorage.getItem('evDeposit')||'';
    const dw=sessionStorage.getItem('evDriveway')||'';
    const cc=sessionStorage.getItem('evCurrentCar')||'their current car';
    const epm=sessionStorage.getItem('evPXModel')||'';
    const hpx=['Yes','Maybe'].includes(sessionStorage.getItem('evPX')||'');
    const nt=sessionStorage.getItem('evNotes')||'';
    const es=sessionStorage.getItem('evStyle')||'BMW EV';
    const fmt=v=>v?Number(v.replace(/,/g,'')).toLocaleString('en-GB'):'';
    const mStr=mil?fmt(mil)+' miles a year':'';
    const bStr=fund==='Cash / outright'?(ca?'£'+fmt(ca)+' outright':''):(mo?'£'+fmt(mo)+' a month':'');
    const dStr=dep?'£'+fmt(dep)+' deposit':'';
    const pxStr=hpx?[cc,epm].filter(Boolean).join(' '):'';
    const bLine=(bStr&&dStr)?'Budget: '+bStr+', with '+dStr+' ready to go':bStr?'Budget: '+bStr:dStr?dStr+' ready to go':'';
    const dwNote=dw==='Yes'?'They have a driveway, which opens up the best overnight charging tariffs.':dw==='No'?"They don't have a driveway yet, so Dan will factor in the best alternatives.":'';
    const pxLine=pxStr?'Their '+pxStr+' was noted as a part exchange.':'';
    const ntLine=nt?'In their own words: “'+nt+'”':'';
    return 'There once was someone called '+fn+' who had been watching the electric revolution from a thoughtful distance — until the range, the technology, and the savings all started making serious sense.\n\n'+(mStr?'With '+mStr+' ahead of them':'Ready for a change')+', '+first+' reached out to Dan — someone who made this switch himself and knows what the questions sound like from both sides. A '+es+' had the appeal: the performance you expect from a BMW, the running costs you didn\'t expect to be quite so good. '+(bLine?bLine+'. ':'')+dwNote+' '+pxLine+'\n\n'+(ntLine?ntLine+'\n\n':'')+'Dan will map out the weekly saving versus the '+cc+', crunch the real numbers, and come back with a proper personalised answer — not a brochure, a conversation built around '+first+'\'s actual life.';
  }

  async function submit() {
    const btn = document.getElementById('sb');
    btn.textContent = 'Sending...'; btn.disabled = true;
    const name  = sessionStorage.getItem('evName')  || '';
    const email = sessionStorage.getItem('evEmail') || '';
    const mil   = sessionStorage.getItem('evMileage') || '0';
    const cp    = sessionStorage.getItem('evCurrentPayment') || '0';
    const calUrl = 'https://cal.eu/danbmwruxley/telephone-appointment?' + new URLSearchParams({name, email}).toString();
    const fmt = (k) => sessionStorage.getItem(k) ? '£' + Number(sessionStorage.getItem(k)).toLocaleString('en-GB') : '';
    const market = await pollMarket(sessionStorage.getItem('evMarketRunId'));
    const story = generateEVStory();
    sessionStorage.setItem('evCustomerStory', story);
    const payload = {
      subject:           'EV Lead — ' + name,
      replyto:           email,
      leadtype:          'Electric Vehicle Enquiry',
      name, email,
      phone:             sessionStorage.getItem('evPhone'),
      postcode:          sessionStorage.getItem('evPostcode'),
      besttime:          sessionStorage.getItem('evBestTime'),
      lifestyle:         sessionStorage.getItem('evLifestyle'),
      evstyle:           sessionStorage.getItem('evStyle'),
      timeline:          sessionStorage.getItem('evTimeline'),
      funding:           sessionStorage.getItem('evFunding'),
      currentpayment:    fmt('evCurrentPayment') + '/mo',
      monthlybudget:     fmt('evMonthlyBudget')  + '/mo',
      cashbudget:        fmt('evCashBudget'),
      annualmileage:     Number(mil).toLocaleString('en-GB'),
      longtrips200miles: sessionStorage.getItem('evLongTripsLabel'),
      driveway:          sessionStorage.getItem('evDriveway'),
      homecharger:       sessionStorage.getItem('evCharger'),
      partexchange:      sessionStorage.getItem('evPX'),
      pxreg:             sessionStorage.getItem('evReg'),
      currentcar:        sessionStorage.getItem('evCurrentCar'),
      pxmodel:           sessionStorage.getItem('evPXModel') || '',
      pxmileage:         sessionStorage.getItem('evPXMileage'),
      onlinebuyerquote:  fmt('evWBAC'),
      pxservicehistory:  sessionStorage.getItem('evPXService'),
      pxfinance:         sessionStorage.getItem('evPXFinance'),
      pxsettlement:      fmt('evSettlement'),
      pxcondition:       sessionStorage.getItem('evPXCond'),
      notes:             sessionStorage.getItem('evNotes'),
      marketing_opt_in:  sessionStorage.getItem('evMarketingOptIn')    || 'No',
      marketing_channels:sessionStorage.getItem('evMarketingChannels') || '',
      customer_story:    story,
      px_market_low:           market ? market.low   : '',
      px_market_avg:           market ? market.avg   : '',
      px_market_high:          market ? market.high  : '',
      px_market_trade_estimate: market ? market.trade : '',
    };
    try {
      await fetch('https://formspree.io/f/xqewleog', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'Accept': 'application/json'},
        body: JSON.stringify(payload)
      });
    } catch(e) {}
    sessionStorage.setItem('evBookingUrl', calUrl);
    window.location.href = 'ev-thankyou.html';
  }
</script>
