# Deploy config for the vehicle lookup worker (worker.js).
# Deploy from the repo root:  npx wrangler deploy -c wrangler.vehicleproxy.toml
# This file is not published on the website (_config.yml excludes *.toml).
name = "vehicleproxy"
main = "worker.js"
compatibility_date = "2026-05-05"
workers_dev = true
preview_urls = false

# DVLA_API_KEY is set as a dashboard variable; keep_vars stops a deploy from
# wiping it. The other keys (APIFY_TOKEN, MOT_*) are secrets and are kept anyway.
keep_vars = true

[observability]
enabled = true

# Per-IP limits, 60-second windows. Keep in step with LIMITS in worker.js.
# namespace_id just has to be a number unique within the Cloudflare account.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "41001"
simple = { limit = 30, period = 60 }

[[ratelimits]]
name = "MARKET_START_LIMITER"
namespace_id = "41002"
simple = { limit = 4, period = 60 }

[[ratelimits]]
name = "POLL_LIMITER"
namespace_id = "41003"
simple = { limit = 60, period = 60 }
